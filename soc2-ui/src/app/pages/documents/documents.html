<div class="flex items-center justify-between gap-4 flex-wrap">
  <button
    (click)="generateAndDownload()"
    [disabled]="generating()"
    class="rounded-xl bg-black text-white px-6 py-2 font-semibold disabled:opacity-40"
  >
    {{ generating() ? 'Generating...' : 'Generate & Download ZIP' }}
  </button>
</div>

@if (error()) {
  <div class="mt-4 text-sm text-red-700 bg-red-50 border border-red-200 p-3 rounded-xl">
    {{ error() }}
  </div>
}

@if (message()) {
  <div class="mt-4 text-sm text-green-700 bg-green-50 border border-green-200 p-3 rounded-xl">
    {{ message() }}
  </div>
}
