<div class="mt-6 bg-white rounded-2xl shadow p-6">
  <h2 class="text-lg font-semibold mb-4">Compliance Status</h2>

  @if (loading()) {
    <div>Loading...</div>
  } @else {
    @for (fw of frameworks(); track fw.frameworkId) {
      <div class="mb-6">
        <div class="flex justify-between mb-2">
          <div class="font-medium">
            {{ fw.name }}
          </div>
          <div class="font-semibold">
            {{ fw.score }}%
          </div>
        </div>

        <div class="w-full bg-gray-200 rounded-full h-3">
          <div
            class="h-3 rounded-full transition-all duration-500"
            [class]="progressColor(fw.score)"
            [style.width.%]="fw.score"
          ></div>
        </div>

        <a
          [routerLink]="['/controls', fw.frameworkId]"
          class="text-sm text-blue-600 mt-2 inline-block"
        >
          View Controls →
        </a>
      </div>
    }

    @if (frameworks().length === 0) {
      <div class="text-gray-600 text-sm">
        No frameworks enabled yet.
      </div>
    }
  }
</div>
